variable.float.waterSurfaceLockTime = if(isEyeInWater == 1, 100000000000000.0, 0.0)
uniform.float.waterEnteredAltitude = smooth(eyeAltitude, waterSurfaceLockTime, waterSurfaceLockTime)

# Cloud weather interpolates deterministic daily anchors.
variable.float.cloudDayPhase = worldTime / 24000.0
variable.float.cloudDayBlend = cloudDayPhase * cloudDayPhase * (3.0 - 2.0 * cloudDayPhase)
variable.float.cloudCurrentRawX = sin((worldDay - 1) * 12.9898 + 78.233) * 43758.5453
variable.float.cloudCurrentRawY = sin((worldDay - 1) * 39.3467 + 11.135) * 24634.6345
variable.float.cloudNextRawX = sin(worldDay * 12.9898 + 78.233) * 43758.5453
variable.float.cloudNextRawY = sin(worldDay * 39.3467 + 11.135) * 24634.6345
variable.float.cloudCurrentX = if(worldDay > 1, (cloudCurrentRawX - floor(cloudCurrentRawX) - 0.5) * 14000.0, 0.0)
variable.float.cloudCurrentY = if(worldDay > 1, (cloudCurrentRawY - floor(cloudCurrentRawY) - 0.5) * 14000.0, 0.0)
variable.float.cloudNextX = if(worldDay > 0, (cloudNextRawX - floor(cloudNextRawX) - 0.5) * 14000.0, 0.0)
variable.float.cloudNextY = if(worldDay > 0, (cloudNextRawY - floor(cloudNextRawY) - 0.5) * 14000.0, 0.0)
uniform.vec2.cloudDailyOffset = vec2(cloudCurrentX + (cloudNextX - cloudCurrentX) * cloudDayBlend, cloudCurrentY + (cloudNextY - cloudCurrentY) * cloudDayBlend)

