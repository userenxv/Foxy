# Runtime Uniforms ------------------------------------------------------------
# TAA uses 8 R2 phases; TAAU uses ceil(8 / scale^2).
variable.int.srJitterPeriod = if(FOXY_TAAU == 1, if(FOXY_TAAU_RENDER_SCALE <= 0.5001, 32, if(FOXY_TAAU_RENDER_SCALE <= 0.5501, 27, if(FOXY_TAAU_RENDER_SCALE <= 0.6001, 23, if(FOXY_TAAU_RENDER_SCALE <= 0.6501, 19, if(FOXY_TAAU_RENDER_SCALE <= 0.6701, 18, if(FOXY_TAAU_RENDER_SCALE <= 0.7001, 17, if(FOXY_TAAU_RENDER_SCALE <= 0.7501, 15, if(FOXY_TAAU_RENDER_SCALE <= 0.7701, 14, if(FOXY_TAAU_RENDER_SCALE <= 0.8001, 13, if(FOXY_TAAU_RENDER_SCALE <= 0.8501, 12, if(FOXY_TAAU_RENDER_SCALE <= 0.9001, 10, 9))))))))))), 8)
variable.int.srJitterPhaseOffset = if(FOXY_TAA_ENABLED == 1, if(FOXY_TAAU == 1, 1, 0), 0)
variable.int.srJitterIndex = (frameCounter % srJitterPeriod) + srJitterPhaseOffset
variable.int.srPreviousJitterIndex = ((frameCounter + srJitterPeriod - 1) % srJitterPeriod) + srJitterPhaseOffset
variable.float.srJitterAmplitude = if(FOXY_TAA_ENABLED == 1, if(FOXY_TAAU == 1, 1.0, FOXY_TAA_JITTER_SCALE), 0.0)
variable.float.srR2X = frac(srJitterIndex * 0.7548776662466927 + 0.5) * 2.0 - 1.0
variable.float.srR2Y = frac(srJitterIndex * 0.5698402909980532 + 0.5) * 2.0 - 1.0
variable.float.srPreviousR2X = frac(srPreviousJitterIndex * 0.7548776662466927 + 0.5) * 2.0 - 1.0
variable.float.srPreviousR2Y = frac(srPreviousJitterIndex * 0.5698402909980532 + 0.5) * 2.0 - 1.0
variable.float.srJitterX = srR2X * srJitterAmplitude
variable.float.srJitterY = srR2Y * srJitterAmplitude
variable.float.srPreviousJitterX = srPreviousR2X * srJitterAmplitude
variable.float.srPreviousJitterY = srPreviousR2Y * srJitterAmplitude
variable.float.srTemporalScale = if(FOXY_TAA_ENABLED == 1, if(FOXY_TAAU == 1, FOXY_TAAU_RENDER_SCALE, 1.0), 1.0)
variable.float.srRenderSizeX = max(floor(viewWidth * srTemporalScale), 1.0)
variable.float.srRenderSizeY = max(floor(viewHeight * srTemporalScale), 1.0)
uniform.vec2.srJitter = vec2(srJitterX / viewWidth, srJitterY / viewHeight)
uniform.vec2.temporalJitter = vec2(srJitterX / srRenderSizeX, srJitterY / srRenderSizeY)
uniform.vec2.previousTemporalJitter = vec2(srPreviousJitterX / srRenderSizeX, srPreviousJitterY / srRenderSizeY)

# Voxy external patches require these values in Iris's uniform registry.
uniform.vec2.view_pixel_size = vec2(1.0 / viewWidth, 1.0 / viewHeight)
uniform.vec2.taa_offset = srJitter
variable.float.voxySunLength = max(sqrt((sunPosition.x * sunPosition.x) + (sunPosition.y * sunPosition.y) + (sunPosition.z * sunPosition.z)), 0.000001)
variable.float.voxySunViewX = sunPosition.x / voxySunLength
variable.float.voxySunViewY = sunPosition.y / voxySunLength
variable.float.voxySunViewZ = sunPosition.z / voxySunLength
variable.float.voxySunWorldX = gbufferModelViewInverse.0.0 * voxySunViewX + gbufferModelViewInverse.1.0 * voxySunViewY + gbufferModelViewInverse.2.0 * voxySunViewZ
variable.float.voxySunWorldY = gbufferModelViewInverse.0.1 * voxySunViewX + gbufferModelViewInverse.1.1 * voxySunViewY + gbufferModelViewInverse.2.1 * voxySunViewZ
variable.float.voxySunWorldZ = gbufferModelViewInverse.0.2 * voxySunViewX + gbufferModelViewInverse.1.2 * voxySunViewY + gbufferModelViewInverse.2.2 * voxySunViewZ
uniform.vec3.sun_dir = vec3(voxySunWorldX, voxySunWorldY, voxySunWorldZ)
variable.float.voxyMoonLength = max(sqrt((moonPosition.x * moonPosition.x) + (moonPosition.y * moonPosition.y) + (moonPosition.z * moonPosition.z)), 0.000001)
variable.float.voxyMoonViewX = moonPosition.x / voxyMoonLength
variable.float.voxyMoonViewY = moonPosition.y / voxyMoonLength
variable.float.voxyMoonViewZ = moonPosition.z / voxyMoonLength
variable.float.voxyMoonWorldX = gbufferModelViewInverse.0.0 * voxyMoonViewX + gbufferModelViewInverse.1.0 * voxyMoonViewY + gbufferModelViewInverse.2.0 * voxyMoonViewZ
variable.float.voxyMoonWorldY = gbufferModelViewInverse.0.1 * voxyMoonViewX + gbufferModelViewInverse.1.1 * voxyMoonViewY + gbufferModelViewInverse.2.1 * voxyMoonViewZ
variable.float.voxyMoonWorldZ = gbufferModelViewInverse.0.2 * voxyMoonViewX + gbufferModelViewInverse.1.2 * voxyMoonViewY + gbufferModelViewInverse.2.2 * voxyMoonViewZ
uniform.vec3.moon_dir = vec3(voxyMoonWorldX, voxyMoonWorldY, voxyMoonWorldZ)
variable.float.voxyLightWorldX = if(sunAngle < 0.5, voxySunWorldX, voxyMoonWorldX)
variable.float.voxyLightWorldY = if(sunAngle < 0.5, voxySunWorldY, voxyMoonWorldY)
variable.float.voxyLightWorldZ = if(sunAngle < 0.5, voxySunWorldZ, voxyMoonWorldZ)
uniform.vec3.light_dir = vec3(voxyLightWorldX, voxyLightWorldY, voxyLightWorldZ)

# Buffer Sizes ----------------------------------------------------------------
# Ray and voxel buffers exist only while their owning mode is active.
# colortex11: world/water staging and broad temporal output.
# colortex14/0: reflection and HDR staging before temporal resolve.
# colortex1: weather/cloud source, then quarter-size Bloom.
# colortex3: transient full-resolution weather/particle layer through composite9.
size.buffer.colortex1=0.25 0.25
size.buffer.colortex10=0.25 0.25
size.buffer.colortex3=1.0 1.0
size.buffer.colortex4=0.25 0.25
size.buffer.colortex5=FOXY_VL_RESOLUTION FOXY_VL_RESOLUTION
# Current-frame resolved volume. Broad TAA is the only temporal owner.
size.buffer.colortex6=1.0 1.0
size.buffer.colortex7=256 192
size.buffer.colortex8=1.0 1.0
size.buffer.colortex9=1.0 1.0
size.buffer.colortex11=1.0 1.0
size.buffer.colortex12=1.0 1.0
size.buffer.colortex13=1.0 1.0
size.buffer.colortex15=1.0 1.0

